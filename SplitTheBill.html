<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分账单</title>
  <style>
    :root {
      --bg: #f6f7f2;
      --panel: #ffffff;
      --panel-soft: #f0f6f4;
      --ink: #1f2933;
      --muted: #60707b;
      --line: #d9e0dc;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --warn: #b45309;
      --bad: #b42318;
      --good: #047857;
      --blue: #2563eb;
      --shadow: 0 14px 32px rgba(25, 36, 48, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.05;
      font-weight: 800;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(330px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .panel,
    .bill-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 18px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2,
    h3 {
      margin: 0;
      line-height: 1.2;
    }

    h2 {
      font-size: 19px;
    }

    h3 {
      font-size: 16px;
    }

    .small-text {
      color: var(--muted);
      font-size: 13px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 11px;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      min-height: 40px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 13px;
      font-weight: 800;
      color: var(--ink);
      background: #e7ece9;
      transition: transform 120ms ease, background 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: #dce6e2;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--accent-dark);
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .btn.danger {
      background: #fee4e2;
      color: var(--bad);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: #edf2ef;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
    }

    .icon-btn:hover {
      color: var(--ink);
      background: #dfe8e4;
    }

    .icon-btn.danger:hover {
      color: var(--bad);
      background: #fee4e2;
    }

    .user-row,
    .item-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .item-row {
      grid-template-columns: minmax(100px, 1fr) 110px auto;
      margin-top: 8px;
    }

    .user-list,
    .person-items {
      display: grid;
      gap: 8px;
    }

    .person-block {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: var(--radius);
      padding: 12px;
    }

    .person-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .amount-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0 0;
    }

    .metric {
      background: #f8faf9;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric strong {
      display: block;
      font-size: 18px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .tab {
      background: transparent;
      color: var(--muted);
      padding: 9px 11px 10px;
      border-bottom: 3px solid transparent;
      font-weight: 800;
    }

    .tab.active {
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .bill-card {
      overflow: hidden;
    }

    .bill-card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
    }

    .bill-card-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .bill-card-body {
      padding: 14px 16px 16px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: #f8faf9;
      font-size: 12px;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .money {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .positive {
      color: var(--good);
      font-weight: 800;
    }

    .negative {
      color: var(--bad);
      font-weight: 800;
    }

    .settle-list {
      display: grid;
      gap: 8px;
      margin: 12px 0 0;
    }

    .settle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .settle-row strong {
      color: var(--blue);
    }

    .empty-state {
      border: 1px dashed #b9c7c0;
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      background: #fbfcfb;
    }

    .alert {
      display: none;
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: var(--warn);
      font-weight: 700;
    }

    .alert.show {
      display: block;
    }

    .hide {
      display: none;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .app-shell {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }

      .two-col,
      .amount-strip {
        grid-template-columns: 1fr;
      }

      .item-row {
        grid-template-columns: 1fr 92px auto;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="title-block">
        <h1>分账单</h1>
        <p>多用户、多笔账、单独项目和总账结算。</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="exportBtn" type="button">导出</button>
        <button class="btn danger" id="resetBtn" type="button">清空</button>
      </div>
    </header>

    <div class="layout">
      <section class="stack">
        <div class="panel">
          <div class="section-head">
            <h2>参与用户</h2>
            <button class="icon-btn" id="addUserBtn" type="button" title="添加用户" aria-label="添加用户">+</button>
          </div>
          <div class="user-list" id="userList"></div>
        </div>

        <div class="panel">
          <div class="section-head">
            <h2>添加一笔账</h2>
            <span class="small-text" id="peopleCount"></span>
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="billName">账单名称</label>
              <input id="billName" type="text" placeholder="例如：晚饭、电影票、打车">
            </div>

            <div class="two-col">
              <div class="field">
                <label for="payerSelect">付款人</label>
                <select id="payerSelect"></select>
              </div>
              <div class="field">
                <label for="totalAmount">总金额</label>
                <input id="totalAmount" type="number" min="0" step="0.01" placeholder="0.00">
              </div>
            </div>

            <div class="amount-strip" id="draftMetrics">
              <div class="metric">
                <span>单独项目</span>
                <strong id="draftPrivate">¥0.00</strong>
              </div>
              <div class="metric">
                <span>可平分</span>
                <strong id="draftShared">¥0.00</strong>
              </div>
              <div class="metric">
                <span>每人平分</span>
                <strong id="draftPerPerson">¥0.00</strong>
              </div>
              <div class="metric">
                <span>人数</span>
                <strong id="draftPeople">0</strong>
              </div>
            </div>

            <div class="alert" id="formAlert"></div>

            <div class="section-head" style="margin: 4px 0 0;">
              <h3>单独项目</h3>
              <span class="small-text">不填则全部平分</span>
            </div>
            <div class="person-items" id="personItems"></div>

            <button class="btn primary" id="addBillBtn" type="button">添加账单</button>
          </div>
        </div>
      </section>

      <section class="stack">
        <div class="panel" id="summaryPanel">
          <div class="section-head">
            <h2>总账</h2>
            <span class="small-text" id="billCount"></span>
          </div>
          <div id="summaryContent"></div>
        </div>

        <div class="panel">
          <div class="tabs">
            <button class="tab active" id="detailsTab" type="button">每笔明细</button>
            <button class="tab" id="exportTab" type="button">文本汇总</button>
          </div>
          <div id="detailsView"></div>
          <div class="hide" id="textView">
            <div class="field">
              <label for="exportText">可复制文本</label>
              <textarea id="exportText" readonly style="width:100%; min-height:360px; resize:vertical; border:1px solid var(--line); border-radius:6px; padding:12px; color:var(--ink);"></textarea>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "bill-splitter-v1";
    const yuanFormatter = new Intl.NumberFormat("zh-CN", {
      style: "currency",
      currency: "CNY",
      minimumFractionDigits: 2
    });

    const state = loadState();

    const els = {
      addUserBtn: document.querySelector("#addUserBtn"),
      userList: document.querySelector("#userList"),
      payerSelect: document.querySelector("#payerSelect"),
      billName: document.querySelector("#billName"),
      totalAmount: document.querySelector("#totalAmount"),
      personItems: document.querySelector("#personItems"),
      addBillBtn: document.querySelector("#addBillBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      exportBtn: document.querySelector("#exportBtn"),
      formAlert: document.querySelector("#formAlert"),
      draftPrivate: document.querySelector("#draftPrivate"),
      draftShared: document.querySelector("#draftShared"),
      draftPerPerson: document.querySelector("#draftPerPerson"),
      draftPeople: document.querySelector("#draftPeople"),
      peopleCount: document.querySelector("#peopleCount"),
      billCount: document.querySelector("#billCount"),
      summaryContent: document.querySelector("#summaryContent"),
      detailsView: document.querySelector("#detailsView"),
      textView: document.querySelector("#textView"),
      detailsTab: document.querySelector("#detailsTab"),
      exportTab: document.querySelector("#exportTab"),
      exportText: document.querySelector("#exportText")
    };

    function makeId(prefix) {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function loadState() {
      const fallback = {
        users: [
          { id: makeId("user"), name: "用户A" },
          { id: makeId("user"), name: "用户B" }
        ],
        draftItems: {},
        bills: []
      };

      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !Array.isArray(saved.users) || !Array.isArray(saved.bills)) {
          return fallback;
        }
        if (!saved.users.length) {
          saved.users = fallback.users;
        }
        saved.draftItems = saved.draftItems || {};
        return saved;
      } catch {
        return fallback;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function money(value) {
      return yuanFormatter.format(roundMoney(value));
    }

    function amount(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function roundMoney(value) {
      return Math.round((Number(value) + Number.EPSILON) * 100) / 100;
    }

    function normaliseName(name, index) {
      const trimmed = String(name || "").trim();
      return trimmed || `用户${index + 1}`;
    }

    function ensureDraftItems() {
      state.users.forEach((user) => {
        if (!Array.isArray(state.draftItems[user.id])) {
          state.draftItems[user.id] = [];
        }
      });

      Object.keys(state.draftItems).forEach((id) => {
        if (!state.users.some((user) => user.id === id)) {
          delete state.draftItems[id];
        }
      });
    }

    function privateTotalFor(items) {
      return items.reduce((sum, item) => sum + Math.max(0, amount(item.amount)), 0);
    }

    function getDraftPrivateTotal() {
      return state.users.reduce((sum, user) => sum + privateTotalFor(state.draftItems[user.id] || []), 0);
    }

    function setAlert(message) {
      els.formAlert.textContent = message;
      els.formAlert.classList.toggle("show", Boolean(message));
    }

    function calculateBill(bill) {
      const total = roundMoney(bill.total);
      const users = bill.users;
      const individualTotals = {};

      users.forEach((user) => {
        individualTotals[user.id] = privateTotalFor(bill.items[user.id] || []);
      });

      const privateTotal = roundMoney(Object.values(individualTotals).reduce((sum, value) => sum + value, 0));
      const sharedTotal = roundMoney(total - privateTotal);
      const sharedEach = users.length ? roundMoney(sharedTotal / users.length) : 0;

      const rows = users.map((user) => {
        const individual = roundMoney(individualTotals[user.id] || 0);
        const shouldPay = roundMoney(sharedEach + individual);
        const paid = user.id === bill.payerId ? total : 0;
        const balance = roundMoney(paid - shouldPay);
        return {
          id: user.id,
          name: user.name,
          individual,
          shared: sharedEach,
          shouldPay,
          paid,
          balance
        };
      });

      return {
        ...bill,
        privateTotal,
        sharedTotal,
        sharedEach,
        rows,
        settlements: makeSettlements(rows)
      };
    }

    function makeSettlements(rows) {
      const debtors = rows
        .filter((row) => row.balance < -0.005)
        .map((row) => ({ name: row.name, amount: roundMoney(-row.balance) }));
      const creditors = rows
        .filter((row) => row.balance > 0.005)
        .map((row) => ({ name: row.name, amount: roundMoney(row.balance) }));
      const settlements = [];
      let i = 0;
      let j = 0;

      while (i < debtors.length && j < creditors.length) {
        const pay = roundMoney(Math.min(debtors[i].amount, creditors[j].amount));
        if (pay > 0) {
          settlements.push({
            from: debtors[i].name,
            to: creditors[j].name,
            amount: pay
          });
        }
        debtors[i].amount = roundMoney(debtors[i].amount - pay);
        creditors[j].amount = roundMoney(creditors[j].amount - pay);
        if (debtors[i].amount <= 0.005) i += 1;
        if (creditors[j].amount <= 0.005) j += 1;
      }

      return settlements;
    }

    function calculateSummary() {
      const balances = new Map();
      state.bills.map(calculateBill).forEach((bill) => {
        bill.rows.forEach((row) => {
          const existing = balances.get(row.id) || { id: row.id, name: row.name, balance: 0 };
          const currentUser = state.users.find((user) => user.id === row.id);
          balances.set(row.id, {
            ...existing,
            name: currentUser?.name || existing.name,
            balance: roundMoney(existing.balance + row.balance)
          });
        });
      });

      const rows = [...balances.values()]
        .map((row) => ({ ...row, balance: roundMoney(row.balance) }))
        .sort((a, b) => a.name.localeCompare(b.name, "zh-CN"));

      return {
        rows,
        settlements: makeSettlements(rows)
      };
    }

    function renderUsers() {
      ensureDraftItems();
      els.userList.innerHTML = "";

      state.users.forEach((user, index) => {
        const row = document.createElement("div");
        row.className = "user-row";

        const input = document.createElement("input");
        input.value = user.name;
        input.placeholder = `用户${index + 1}`;
        input.addEventListener("input", () => {
          user.name = normaliseName(input.value, index);
          saveState();
          renderPayerOptions();
          renderPersonItems();
          renderResults();
        });

        const remove = document.createElement("button");
        remove.className = "icon-btn danger";
        remove.type = "button";
        remove.title = "删除用户";
        remove.setAttribute("aria-label", `删除${user.name}`);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          if (state.users.length <= 2) {
            setAlert("至少需要两个用户。");
            return;
          }
          delete state.draftItems[user.id];
          state.users.splice(index, 1);
          if (!state.users.some((person) => person.id === els.payerSelect.value)) {
            els.payerSelect.value = state.users[0]?.id || "";
          }
          saveState();
          render();
        });

        row.append(input, remove);
        els.userList.append(row);
      });

      els.peopleCount.textContent = `${state.users.length} 人`;
    }

    function renderPayerOptions() {
      const current = els.payerSelect.value || state.users[0]?.id;
      els.payerSelect.innerHTML = "";
      state.users.forEach((user) => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = user.name;
        els.payerSelect.append(option);
      });
      els.payerSelect.value = state.users.some((user) => user.id === current) ? current : state.users[0]?.id || "";
    }

    function renderPersonItems() {
      ensureDraftItems();
      els.personItems.innerHTML = "";

      state.users.forEach((user) => {
        const block = document.createElement("div");
        block.className = "person-block";

        const head = document.createElement("div");
        head.className = "person-head";
        const title = document.createElement("h3");
        title.textContent = user.name;
        const add = document.createElement("button");
        add.className = "icon-btn";
        add.type = "button";
        add.title = "添加单独项目";
        add.setAttribute("aria-label", `给${user.name}添加单独项目`);
        add.textContent = "+";
        add.addEventListener("click", () => {
          state.draftItems[user.id].push({ name: "", amount: "" });
          saveState();
          renderPersonItems();
          renderDraftMetrics();
        });
        head.append(title, add);

        const itemsWrap = document.createElement("div");
        itemsWrap.className = "items-wrap";
        const items = state.draftItems[user.id];

        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "small-text";
          empty.textContent = "无";
          itemsWrap.append(empty);
        }

        items.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = "item-row";

          const name = document.createElement("input");
          name.value = item.name || "";
          name.placeholder = "项目";
          name.addEventListener("input", () => {
            item.name = name.value;
            saveState();
          });

          const value = document.createElement("input");
          value.type = "number";
          value.min = "0";
          value.step = "0.01";
          value.value = item.amount || "";
          value.placeholder = "金额";
          value.addEventListener("input", () => {
            item.amount = value.value;
            saveState();
            renderDraftMetrics();
          });

          const remove = document.createElement("button");
          remove.className = "icon-btn danger";
          remove.type = "button";
          remove.title = "删除项目";
          remove.setAttribute("aria-label", "删除项目");
          remove.textContent = "×";
          remove.addEventListener("click", () => {
            items.splice(index, 1);
            saveState();
            renderPersonItems();
            renderDraftMetrics();
          });

          row.append(name, value, remove);
          itemsWrap.append(row);
        });

        block.append(head, itemsWrap);
        els.personItems.append(block);
      });
    }

    function renderDraftMetrics() {
      const total = Math.max(0, amount(els.totalAmount.value));
      const privateTotal = getDraftPrivateTotal();
      const sharedTotal = roundMoney(total - privateTotal);
      const perPerson = state.users.length ? roundMoney(sharedTotal / state.users.length) : 0;

      els.draftPrivate.textContent = money(privateTotal);
      els.draftShared.textContent = money(sharedTotal);
      els.draftPerPerson.textContent = money(perPerson);
      els.draftPeople.textContent = state.users.length;

      if (privateTotal - total > 0.005) {
        setAlert("单独项目金额已经超过总金额。");
      } else if (els.formAlert.textContent === "单独项目金额已经超过总金额。") {
        setAlert("");
      }
    }

    function renderResults() {
      const calculatedBills = state.bills.map(calculateBill);
      const summary = calculateSummary();
      els.billCount.textContent = `${state.bills.length} 笔`;
      renderSummary(summary);
      renderDetails(calculatedBills);
      renderExportText(calculatedBills, summary);
    }

    function renderSummary(summary) {
      if (!state.bills.length) {
        els.summaryContent.innerHTML = `<div class="empty-state">还没有账单</div>`;
        return;
      }

      const tableRows = summary.rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.name)}</td>
          <td class="money ${row.balance >= 0 ? "positive" : "negative"}">${money(row.balance)}</td>
        </tr>
      `).join("");

      const settlements = renderSettlementRows(summary.settlements);
      els.summaryContent.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>用户</th>
                <th>总净额（正数为应收）</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
        <div class="settle-list">${settlements}</div>
      `;
    }

    function renderDetails(bills) {
      if (!bills.length) {
        els.detailsView.innerHTML = `<div class="empty-state">添加一笔账后，这里会出现明细</div>`;
        return;
      }

      els.detailsView.innerHTML = bills.map((bill, index) => {
        const payer = bill.users.find((user) => user.id === bill.payerId);
        const itemRows = bill.rows.map((row) => {
          const itemNames = (bill.items[row.id] || [])
            .filter((item) => amount(item.amount) > 0)
            .map((item) => `${escapeHtml(item.name || "单独项目")} ${money(amount(item.amount))}`)
            .join("<br>");
          return `
            <tr>
              <td>${escapeHtml(row.name)}</td>
              <td>${itemNames || "无"}</td>
              <td class="money">${money(row.individual)}</td>
              <td class="money">${money(row.shared)}</td>
              <td class="money">${money(row.shouldPay)}</td>
              <td class="money">${money(row.paid)}</td>
              <td class="money ${row.balance >= 0 ? "positive" : "negative"}">${money(row.balance)}</td>
            </tr>
          `;
        }).join("");

        return `
          <article class="bill-card">
            <div class="bill-card-head">
              <div>
                <h3>${index + 1}. ${escapeHtml(bill.name || "未命名账单")}</h3>
                <p>付款人：${escapeHtml(payer?.name || "未知")} · 总金额：${money(bill.total)}</p>
              </div>
              <button class="icon-btn danger" type="button" data-remove-bill="${bill.id}" title="删除账单" aria-label="删除账单">×</button>
            </div>
            <div class="bill-card-body">
              <div class="amount-strip">
                <div class="metric"><span>单独项目</span><strong>${money(bill.privateTotal)}</strong></div>
                <div class="metric"><span>平分总额</span><strong>${money(bill.sharedTotal)}</strong></div>
                <div class="metric"><span>每人平分</span><strong>${money(bill.sharedEach)}</strong></div>
                <div class="metric"><span>人数</span><strong>${bill.users.length}</strong></div>
              </div>
              <div class="table-wrap" style="margin-top:12px;">
                <table>
                  <thead>
                    <tr>
                      <th>用户</th>
                      <th>单独项目</th>
                      <th>单独合计</th>
                      <th>平分部分</th>
                      <th>应付</th>
                      <th>已付</th>
                      <th>净额</th>
                    </tr>
                  </thead>
                  <tbody>${itemRows}</tbody>
                </table>
              </div>
              <div class="settle-list">${renderSettlementRows(bill.settlements)}</div>
            </div>
          </article>
        `;
      }).join("");

      els.detailsView.querySelectorAll("[data-remove-bill]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.getAttribute("data-remove-bill");
          state.bills = state.bills.filter((bill) => bill.id !== id);
          saveState();
          renderResults();
        });
      });
    }

    function renderSettlementRows(settlements) {
      if (!settlements.length) {
        return `<div class="settle-row"><span>无需转账</span><strong>${money(0)}</strong></div>`;
      }

      return settlements.map((settlement) => `
        <div class="settle-row">
          <span>${escapeHtml(settlement.from)} 给 ${escapeHtml(settlement.to)}</span>
          <strong>${money(settlement.amount)}</strong>
        </div>
      `).join("");
    }

    function renderExportText(calculatedBills, summary) {
      const lines = [];
      lines.push("分账单");
      lines.push("");

      if (!calculatedBills.length) {
        lines.push("暂无账单");
      }

      calculatedBills.forEach((bill, index) => {
        const payer = bill.users.find((user) => user.id === bill.payerId);
        lines.push(`${index + 1}. ${bill.name || "未命名账单"}`);
        lines.push(`付款人：${payer?.name || "未知"}，总金额：${money(bill.total)}`);
        lines.push(`单独项目：${money(bill.privateTotal)}，平分总额：${money(bill.sharedTotal)}，每人平分：${money(bill.sharedEach)}`);
        bill.rows.forEach((row) => {
          lines.push(`- ${row.name}：单独${money(row.individual)}，应付${money(row.shouldPay)}，已付${money(row.paid)}，净额${money(row.balance)}`);
        });
        if (bill.settlements.length) {
          bill.settlements.forEach((settlement) => {
            lines.push(`  ${settlement.from} 给 ${settlement.to} ${money(settlement.amount)}`);
          });
        } else {
          lines.push("  无需转账");
        }
        lines.push("");
      });

      if (calculatedBills.length) {
        lines.push("总账");
        summary.rows.forEach((row) => {
          lines.push(`- ${row.name}：净额${money(row.balance)}`);
        });
        if (summary.settlements.length) {
          summary.settlements.forEach((settlement) => {
            lines.push(`${settlement.from} 给 ${settlement.to} ${money(settlement.amount)}`);
          });
        } else {
          lines.push("无需转账");
        }
      }

      els.exportText.value = lines.join("\n");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function addBill() {
      const total = amount(els.totalAmount.value);
      const privateTotal = getDraftPrivateTotal();
      setAlert("");

      if (state.users.length < 2) {
        setAlert("至少需要两个用户。");
        return;
      }

      if (!els.payerSelect.value) {
        setAlert("请选择付款人。");
        return;
      }

      if (total <= 0) {
        setAlert("总金额需要大于 0。");
        return;
      }

      if (privateTotal - total > 0.005) {
        setAlert("单独项目金额已经超过总金额。");
        return;
      }

      const usersSnapshot = state.users.map((user, index) => ({
        id: user.id,
        name: normaliseName(user.name, index)
      }));

      const itemsSnapshot = {};
      usersSnapshot.forEach((user) => {
        itemsSnapshot[user.id] = (state.draftItems[user.id] || [])
          .map((item) => ({
            name: String(item.name || "").trim(),
            amount: roundMoney(amount(item.amount))
          }))
          .filter((item) => item.amount > 0);
      });

      state.bills.unshift({
        id: makeId("bill"),
        name: els.billName.value.trim() || `账单 ${state.bills.length + 1}`,
        payerId: els.payerSelect.value,
        total: roundMoney(total),
        users: usersSnapshot,
        items: itemsSnapshot,
        createdAt: new Date().toISOString()
      });

      els.billName.value = "";
      els.totalAmount.value = "";
      state.draftItems = {};
      ensureDraftItems();
      saveState();
      render();
    }

    function addUser() {
      const next = state.users.length + 1;
      const user = { id: makeId("user"), name: `用户${next}` };
      state.users.push(user);
      state.draftItems[user.id] = [];
      saveState();
      render();
    }

    function resetAll() {
      if (!confirm("确定清空所有用户、账单和本地保存的数据吗？")) {
        return;
      }
      localStorage.removeItem(STORAGE_KEY);
      const fresh = loadState();
      state.users = fresh.users;
      state.draftItems = fresh.draftItems;
      state.bills = fresh.bills;
      els.billName.value = "";
      els.totalAmount.value = "";
      render();
    }

    function exportText() {
      els.exportTab.click();
      els.exportText.select();
      navigator.clipboard?.writeText(els.exportText.value).catch(() => {});
    }

    function switchView(view) {
      const showingText = view === "text";
      els.textView.classList.toggle("hide", !showingText);
      els.detailsView.classList.toggle("hide", showingText);
      els.exportTab.classList.toggle("active", showingText);
      els.detailsTab.classList.toggle("active", !showingText);
    }

    function render() {
      renderUsers();
      renderPayerOptions();
      renderPersonItems();
      renderDraftMetrics();
      renderResults();
    }

    els.addUserBtn.addEventListener("click", addUser);
    els.addBillBtn.addEventListener("click", addBill);
    els.resetBtn.addEventListener("click", resetAll);
    els.exportBtn.addEventListener("click", exportText);
    els.totalAmount.addEventListener("input", renderDraftMetrics);
    els.detailsTab.addEventListener("click", () => switchView("details"));
    els.exportTab.addEventListener("click", () => switchView("text"));

    render();
  </script>
</body>
</html>
